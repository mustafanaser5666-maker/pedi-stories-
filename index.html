const $=id=>document.getElementById(id);let cur=null,canv=[],flt='الكل';
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k)||'';localStorage.setItem(k,v)}catch(e){return''}};
$('nm').value=ls('nm')||'د. مصطفى الحسيني';$('hd').value=ls('hd');
$('nm').oninput=()=>ls('nm',$('nm').value);$('hd').oninput=()=>ls('hd',$('hd').value);
function chips(){$('chips').innerHTML='';['الكل',...Object.keys(COL)].forEach(k=>{const b=document.createElement('button');b.textContent=k;b.className=k===flt?'on':'alt';b.onclick=()=>{flt=k;chips();list()};$('chips').appendChild(b)})}
function list(){$('list').innerHTML='';D.filter(d=>flt==='الكل'||d.t===flt).forEach(d=>{const c=document.createElement('div');c.className='card';c.innerHTML=`<div><span class="tag" style="background:${COL[d.t]}">${d.t}</span>${d.title}</div>`;const b=document.createElement('button');b.textContent='ولّد';b.onclick=()=>gen(d);c.appendChild(b);$('list').appendChild(c)})}
function wrap(x,t,w){const o=[];let c='';t.split(' ').forEach(s=>{const q=c?c+' '+s:s;if(x.measureText(q).width>w&&c){o.push(c);c=s}else c=q});o.push(c);return o}
function mk(col){const c=document.createElement('canvas');c.width=1080;c.height=1920;const x=c.getContext('2d');const g=x.createLinearGradient(0,0,1080,1920);g.addColorStop(0,col);g.addColorStop(1,'#0b1f2a');x.fillStyle=g;x.fillRect(0,0,1080,1920);x.fillStyle='rgba(255,255,255,.07)';[[900,200,380],[100,1700,320],[950,1500,200]].forEach(a=>{x.beginPath();x.arc(a[0],a[1],a[2],0,7);x.fill()});x.direction='rtl';x.textAlign='center';x.textBaseline='middle';return[c,x]}
function block(x,lines,fs,y0,col,lh){x.font=`800 ${fs}px Cairo,Tahoma,sans-serif`;x.fillStyle=col;const h=lines.length*lh;lines.forEach((l,i)=>x.fillText(l,540,y0-h/2+lh*(i+.5)))}
function pill(x,t,y,col){x.font='800 44px Cairo,Tahoma,sans-serif';const w=x.measureText(t).width+90;x.fillStyle='#fff';x.beginPath();x.roundRect(540-w/2,y-45,w,90,45);x.fill();x.fillStyle=col;x.fillText(t,540,y+3)}
function foot(x,n,h){x.font='600 38px Cairo,Tahoma,sans-serif';x.fillStyle='rgba(255,255,255,.85)';x.fillText([n,h].filter(Boolean).join('  •  '),540,1800)}
function build(d,n,h){const col=COL[d.t]||'#0b7285',S=[];const N='١٢٣٤٥٦٧٨٩';
let [c,x]=mk(col);pill(x,d.t==='خرافة'?'خرافة ولا حقيقة؟':d.t,520,col);x.font='800 84px Cairo,Tahoma,sans-serif';block(x,wrap(x,d.title,900),84,940,'#fff',130);x.font='600 40px Cairo';x.fillStyle='rgba(255,255,255,.8)';x.fillText('اسحب ◀ للتفاصيل',540,1500);foot(x,n,h);S.push(c);
d.pts.forEach((p,i)=>{[c,x]=mk(col);x.fillStyle='#fff';x.beginPath();x.roundRect(80,560,920,800,50);x.fill();x.fillStyle=col;x.beginPath();x.arc(540,560,80,0,7);x.fill();x.font='800 90px Cairo,Tahoma,sans-serif';x.fillStyle='#fff';x.fillText(N[i],540,566);x.font='800 58px Cairo,Tahoma,sans-serif';block(x,wrap(x,p,780),58,980,'#123',92);foot(x,n,h);S.push(c)});
[c,x]=mk(col);block(x,['عجبك المنشور؟'],84,700,'#fff',120);block(x,['💬 شاركه مع أم تحتاجه','🔖 احفظه للرجوع إليه','➕ تابعنا لمعلومات أكثر'],54,1000,'#fff',110);x.font='600 34px Cairo,Tahoma,sans-serif';x.fillStyle='rgba(255,255,255,.8)';x.fillText('للتوعية فقط ولا يغني عن مراجعة الطبيب',540,1600);foot(x,n,h);S.push(c);return S}
async function gen(d){try{await document.fonts.load('800 50px Cairo')}catch(e){}
cur=d;canv=build(d,$('nm').value,$('hd').value);$('out').style.display='block';$('ot').textContent=d.title;$('strip').innerHTML='';canv.forEach(c=>$('strip').appendChild(c));$('sticker').textContent='💡 ضيف على الستوري: '+(d.st||'ستيكر استطلاع أو أسئلة');$('out').scrollIntoView({behavior:'smooth'})}
const blob=c=>new Promise(r=>c.toBlob(r,'image/png'));
$('dl').onclick=async()=>{for(let i=0;i<canv.length;i++){const a=document.createElement('a');a.href=URL.createObjectURL(await blob(canv[i]));a.download=`story-${i+1}.png`;a.click();await new Promise(r=>setTimeout(r,400))}};
$('sh').onclick=async()=>{const f=await Promise.all(canv.map(async(c,i)=>new File([await blob(c)],`story-${i+1}.png`,{type:'image/png'})));if(navigator.canShare&&navigator.canShare({files:f}))try{await navigator.share({files:f})}catch(e){}else $('dl').click()};
$('cb').onclick=()=>{const p=$('cp').value.split('\n').map(s=>s.trim()).filter(Boolean);if(!$('ct').value||!p.length)return;gen({t:'معلومة',title:$('ct').value,pts:p})};
$('ak').value=ls('ak');$('ak').oninput=()=>ls('ak',$('ak').value);
$('ab').onclick=async()=>{const m=$('am'),topic=$('at').value.trim();if(!topic)return;m.style.display='block';m.textContent='⏳ جاري التوليد...';$('ab').disabled=true;try{const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json','x-app-key':$('ak').value},body:JSON.stringify({topic,type:$('ay').value})});if(r.status===404)throw new Error('التوليد بالـAI يشتغل بس على نسخة Vercel');const j=await r.json().catch(()=>({}));if(!r.ok||!j.title)throw new Error(j.error||'تعذر التوليد');D.unshift(j);try{const s=JSON.parse(ls('my')||'[]');s.unshift(j);ls('my',JSON.stringify(s.slice(0,50)))}catch(e){}list();gen(j);m.textContent='✅ تم، راجع المحتوى طبياً قبل النشر'}catch(e){m.textContent='❌ '+e.message}$('ab').disabled=false};
try{JSON.parse(ls('my')||'[]').reverse().forEach(x=>D.unshift(x))}catch(e){}
chips();list();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
